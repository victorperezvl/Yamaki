<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAMAKI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Información</a>
            <a class="navbar-brand" href="#">Quienes somos</a>
            <a class="navbar-brand" href="#">Fotos</a>
            <a class="navbar-brand" href="#">Contacto</a>
        </div>
    </nav>

    <div class="container text-center">
        <h1 class="mt-4">Bienvenido a YAMAKI</h1>
        <p class="lead">Página web de la peluquería Yamaki para coger citas y logearte</p>
        <button id="btnClick" class="btn btn-primary">CITA</button>
        <p id="message" class="mt-3"></p>
    </div>

    <script>
        document.getElementById("btnClick").addEventListener("click", function() {
            document.getElementById("message").innerText = "CALENDARIO";
        });
    </script>

</body>
</html>
